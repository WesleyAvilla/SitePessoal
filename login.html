<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~ ACCESS RESTRICTED ~</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Define o fundo da tela inteira como preto */
        html, body {
            width: 100%;
            height: 100vh;
            background-color: #000000;
            color: #d0d0d0;
            font-family: "Courier New", Courier, monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border: 1px solid #00ff66;
            background: rgba(10, 10, 10, 0.95);
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }

        .login-title {
            color: #00ff66;
            font-size: 20px;
            margin-bottom: 15px;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        .login-desc {
            font-size: 12px;
            color: #aaaaaa;
            margin-bottom: 15px;
        }

        input[type="password"] {
            background: #000000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 10px;
            font-family: "Courier New", Courier, monospace, sans-serif;
            text-align: center;
            width: 80%;
            margin-bottom: 15px;
            outline: none;
            font-size: 16px;
        }

        input[type="password"]:focus {
            box-shadow: 0 0 8px #00ff66;
        }

        button {
            background: #00ff66;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: "Courier New", Courier, monospace, sans-serif;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #ffffff;
            box-shadow: 0 0 10px #ffffff;
        }

        #erro {
            color: #ff3333;
            font-size: 12px;
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 class="login-title">[ ÁREA RESTRITA ]</h2>
        <p class="login-desc">Insira a senha de acesso para visualizar as notas:</p>
        
        <input type="password" id="passInput" placeholder="******" onkeydown="if(event.key === 'Enter') verificarSenha()"><br>
        <button onclick="verificarSenha()">ENTRAR</button>

        <p id="erro">ACESSO NEGADO: Senha incorreta!</p>
    </div>

    <script>
        function verificarSenha() {
            const senhaCorreta = "1234"; // Digite aqui a senha desejada
            const digitada = document.getElementById("passInput").value;

            if (digitada === senhaCorreta) {
                window.location.href = "https://dontpad.com/bababea77"; // Coloque aqui a sua página de destino
            } else {
                document.getElementById("erro").style.display = "block";
            }
        }
    </script>

</body>
</html>
