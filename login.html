<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~ ACCESS RESTRICTED ~</title>
    <link rel="stylesheet" href="lobby-style.css">
    <style>
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            border: 1px solid #00ff66;
            background: rgba(5, 5, 5, 0.85);
        }
        input[type="password"] {
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 8px;
            font-family: monospace;
            text-align: center;
            margin: 10px 0;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="color: #00ff66;">[ ÁREA RESTRITA ]</h2>
        <p style="font-size: 12px; margin-top: 10px;">Insira a senha de acesso para visualizar as notas:</p>

        <input type="password" id="passInput" placeholder="******"><br>
        <button onclick="verificarSenha()">ENTRAR</button>

        <p id="erro" style="color: red; font-size: 12px; display: none; margin-top: 10px;">Senha incorreta!</p>
    </div>

    <script>
        function verificarSenha() {
            const senhaCorreta = "1234"; // Digite aqui a senha desejada
            const digitada = document.getElementById("passInput").value;

            if (digitada === senhaCorreta) {
                window.location.href = "https://dontpad.com/bababea77"; // Nome da sua página de notas
            } else {
                document.getElementById("erro").style.display = "block";
            }
            
        }
    </script>
</body>
</html>
